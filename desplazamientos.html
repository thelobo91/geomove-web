<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoMove - Gestión de desplazamientos</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="encabezado">

        <div class="marca">
            <img src="imagenes/logo_geomove.png" alt="Logo GeoMove">
            <span>GeoMove</span>
        </div>

        <div class="usuario">

            <span class="icono-usuario">👤</span>

            <div class="datos-usuario">
                <strong>Adrian Lobo</strong>
                <span>ID: 1.094.589.274</span>
                <span>Escolta</span>
            </div>

        </div>

    </header>


    <!-- Contenido principal -->
    <main class="contenido-desplazamientos">

        <!-- Encabezado de la sección -->
        <section class="titulo-seccion">

            <h1>Gestión de desplazamientos</h1>

            <p>
                Consulta la información de tus desplazamientos asignados.
            </p>

        </section>


        <!-- Información del desplazamiento -->
        <section class="tarjeta-desplazamiento">

            <div class="cabecera-desplazamiento">

                <div>
                    <h2>Desplazamiento #001</h2>
                    <p>Periodo del desplazamiento</p>
                </div>

            </div>


            <!-- Fechas -->
            <div class="periodo">

                <div class="fecha">
                    <span>Inicio</span>
                    <strong>18/09/2026</strong>
                </div>

                <div class="separador-fechas">
                    →
                </div>

                <div class="fecha">
                    <span>Final</span>
                    <strong>22/09/2026</strong>
                </div>

            </div>


            <!-- Destinos -->
            <div class="seccion-destinos">

                <h3>Destinos</h3>

                <div class="lista-destinos">

                    <!-- Destino 1 -->
                    <div class="destino-item">

                        <span class="punto-destino"></span>

                        <button class="boton-destino">
                            Saravena
                        </button>

                    </div>


                    <!-- Destino 2 -->
                    <div class="destino-item">

                        <span class="punto-destino"></span>

                        <button class="boton-destino">
                            Tame
                        </button>

                    </div>


                    <!-- Destino 3 -->
                    <div class="destino-item">

                        <span class="punto-destino"></span>

                        <button class="boton-destino">
                            Arauca
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
